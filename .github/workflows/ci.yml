name: CI

on:
  push:
    branches: [ master, "feat/*" ]
  pull_request:
    branches: [ master, "feat/*" ]

jobs:
  fast-tests:
    name: Fast Unit Tests & Mutation Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Fast Unit Tests (Domain & Application)
        run: |
          .venv/bin/python -m pytest tests/domain tests/application -v

      - name: Mutation Testing (Domain & Application)
        run: |
          .venv/bin/mutmut run --CI
          .venv/bin/mutmut results
          .venv/bin/python -c "
          import sqlite3, sys
          con = sqlite3.connect('.mutmut-cache')
          cur = con.cursor()
          counts = dict(cur.execute('SELECT status, count(*) FROM mutant GROUP BY status').fetchall())
          killed = counts.get('ok_killed', 0)
          survived = counts.get('bad_survived', 0)
          total = killed + survived
          score = (killed / total * 100) if total > 0 else 0
          print(f'Catraca Mutation: {killed}/{total} mortos ({score:.1f}%), {survived} sobreviventes')
          if total < 500:
              print(f'ERRO: Menos mutantes testados do que o esperado ({total} < 500)!')
              sys.exit(1)
          if survived > 4:
              print(f'ERRO: Catraca violada! {survived} sobreviventes > teto de 4.')
              sys.exit(1)
          if score < 99.0:
              print(f'ERRO: Score {score:.1f}% abaixo do piso homologado de 99.0%!')
              sys.exit(1)
          "