name: CI

on:
  push:
    branches: [ master, "feat/*" ]
  pull_request:
    branches: [ master ]

jobs:
  fast-tests:
    name: Fast Unit Tests & Mutation Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fast Unit Tests (Domain & Application)
        run: |
          pytest tests/domain tests/application -v

      - name: Mutation Testing (Domain & Application)
        run: |
          mutmut run || true
          mutmut results
